services:
  - type: web
    name: orientauneti-app
    env: php
    plan: free
    buildCommand: ""
    startCommand: php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: orientauneti-db
          property: connectionString

databases:
  - name: orientauneti-db
    databaseName: orientauneti
    user: orientauser
    plan: free
